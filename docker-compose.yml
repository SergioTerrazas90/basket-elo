services:
  postgres:
    image: postgres:16-alpine
    container_name: basket-elo-postgres
    environment:
      POSTGRES_USER: basket_elo
      POSTGRES_PASSWORD: basket_elo
      POSTGRES_DB: basket_elo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basket_elo -d basket_elo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/BasketElo.Api/Dockerfile
    container_name: basket-elo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=basket_elo;Username=basket_elo;Password=basket_elo
      InternalAuth__SharedSecret: ${BASKET_ELO_INTERNAL_AUTH_SECRET:-local-dev-secret}
      ApiSports__BaseUrl: https://v1.basketball.api-sports.io
      ApiSports__ApiKey: ${BASKET_ELO_API_SPORTS_API_KEY:-}
      ApiSports__MinSecondsBetweenRequests: 7
      ModelLab__FreeSavedModelLimit: ${BASKET_ELO_FREE_SAVED_MODEL_LIMIT:-1}
      ModelLab__FreeStoredRunLimit: ${BASKET_ELO_FREE_STORED_RUN_LIMIT:-3}
      ModelLab__PaidStoredRunLimit: ${BASKET_ELO_PAID_STORED_RUN_LIMIT:-100}
      ModelLab__FreeLeagueName: ${BASKET_ELO_FREE_LEAGUE_NAME:-ACB}
      ModelLab__PaidEmails: ${BASKET_ELO_PAID_EMAILS:-dev-paid@basket-elo.local}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "5001:8080"

  worker:
    build:
      context: .
      dockerfile: src/BasketElo.Worker/Dockerfile
    container_name: basket-elo-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=basket_elo;Username=basket_elo;Password=basket_elo
      ApiSports__BaseUrl: https://v1.basketball.api-sports.io
      ApiSports__ApiKey: ${BASKET_ELO_API_SPORTS_API_KEY:-}
      ApiSports__MinSecondsBetweenRequests: 7
      EloJobs__WorkerCount: ${BASKET_ELO_ELO_JOB_WORKER_COUNT:-3}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "5002:8080"

  web:
    build:
      context: .
      dockerfile: src/BasketElo.Web/Dockerfile
    container_name: basket-elo-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: http://api:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=basket_elo;Username=basket_elo;Password=basket_elo
      Auth__Enabled: ${BASKET_ELO_AUTH_ENABLED:-false}
      Auth__AdminEmails: ${BASKET_ELO_ADMIN_EMAILS:-}
      InternalAuth__SharedSecret: ${BASKET_ELO_INTERNAL_AUTH_SECRET:-local-dev-secret}
      Authentication__Google__ClientId: ${BASKET_ELO_GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${BASKET_ELO_GOOGLE_CLIENT_SECRET:-}
      StripeBilling__Enabled: ${BASKET_ELO_STRIPE_ENABLED:-false}
      StripeBilling__SecretKey: ${BASKET_ELO_STRIPE_SECRET_KEY:-}
      StripeBilling__WebhookSecret: ${BASKET_ELO_STRIPE_WEBHOOK_SECRET:-}
      StripeBilling__PremiumMonthlyPriceId: ${BASKET_ELO_STRIPE_MONTHLY_PRICE_ID:-}
      StripeBilling__PremiumAnnualPriceId: ${BASKET_ELO_STRIPE_ANNUAL_PRICE_ID:-}
      StripeBilling__AutomaticTaxEnabled: ${BASKET_ELO_STRIPE_AUTOMATIC_TAX_ENABLED:-false}
    depends_on:
      - api
    ports:
      - "5000:8080"

volumes:
  postgres_data:
